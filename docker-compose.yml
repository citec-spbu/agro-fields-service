services:
  client-backend:
    container_name: fields-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8004:8080
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env

  database:
    image: postgis/postgis:15-3.4
    container_name: fields-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    # logical decoding для Debezium / CDC (после смены wal_level может понадобиться пересоздать volume БД)
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - 5434:5432
    volumes:
      - pgdbdata:/var/lib/postgresql/data/
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME} -d ${POSTGRESQL_DATABASE}" ]
      interval: 2s
      timeout: 10s
      retries: 5

volumes:
  pgdbdata:

networks:
  default:
    name: agronetwork
    external: true

